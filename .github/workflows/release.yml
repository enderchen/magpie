# Package preparation only. No registry publication occurs in this workflow.
name: Prepare npm package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: pagesail-npm-package
          path: pagesail-*.tgz
